<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈文案</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Arial", "Helvetica", sans-serif;
            background: #f8f9fa;
            color: #333;
            line-height: 1.8;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        header {
            text-align: center;
            padding: 60px 20px;
            background: #003366;
            color: #fff;
            margin-bottom: 40px;
            border-bottom: 4px solid #666;
        }
        header h1 { font-size: 2em; font-weight: 400; margin-bottom: 20px; letter-spacing: 1px; color: #fff; }
        header .subtitle { font-size: 1em; color: #ccc; font-style: italic; margin-bottom: 30px; font-weight: 300; }
        header .meta {
            font-size: 0.85em; color: #aaa;
            border-top: 1px solid #666;
            padding-top: 20px; margin-top: 20px;
            background: rgba(255,255,255,0.1);
            padding: 15px 30px; display: inline-block;
        }
        .stage-section { margin-bottom: 60px; }
        .stage-header {
            background: #003366; color: #fff;
            padding: 20px 30px; margin-bottom: 30px;
            border-left: 4px solid #003366;
        }
        .stage-header h2 { font-size: 1.5em; font-weight: 400; margin-bottom: 10px; }
        .stage-header .stage-desc { font-size: 0.9em; color: #aaa; }
        .post-card {
            background: #fff; border-radius: 2px; padding: 30px;
            margin-bottom: 25px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0; position: relative;
        }
        .post-meta {
            display: flex; align-items: center; gap: 15px;
            margin-bottom: 20px; padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0; flex-wrap: wrap;
        }
        .post-badge { background: #003366; color: #fff; padding: 4px 12px; border-radius: 2px; font-size: 0.85em; font-weight: 500; }
        .post-date { background: #f0f0f0; color: #666; padding: 4px 12px; border-radius: 2px; font-size: 0.85em; }
        .post-sequence { background: #e8f4f8; color: #003366; padding: 4px 12px; border-radius: 2px; font-size: 0.85em; font-weight: 500; }
        .post-title {
            font-size: 0.95em; font-weight: 400; color: #003366;
            margin-bottom: 20px; font-style: italic;
            display: flex; align-items: center; gap: 8px;
        }
        .post-title::before { content: "—"; font-size: 0.9em; font-style: normal; color: #666; }
        .post-title::after { content: "label"; font-size: 0.75em; color: #999; font-style: normal; margin-left: auto; }
        .post-content { font-size: 0.95em; line-height: 1.9; color: #333; white-space: pre-wrap; margin-bottom: 20px; }
        .post-content strong { color: #003366; font-weight: 600; }
        .post-content blockquote { border-left: 3px solid #003366; padding-left: 20px; margin: 15px 0; color: #666; font-style: italic; }
        .image-suggestion { background: #f8f9fa; border: 1px dashed #666; padding: 15px 20px; border-radius: 2px; font-size: 0.85em; color: #666; }
        .image-suggestion strong { color: #003366; font-weight: 500; }
        .copy-btn {
            position: absolute; top: 15px; right: 15px;
            background: #003366; border: none; padding: 6px 12px;
            border-radius: 2px; font-size: 0.8em; color: #fff;
            cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; gap: 5px;
        }
        .copy-btn:hover { background: #004080; }
        .copy-btn.copied { background: #4caf50; color: #fff; }
        .toc {
            position: fixed; left: 20px; top: 50%; transform: translateY(-50%);
            width: 160px; background: #fff; border-radius: 2px; padding: 20px 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); border: 1px solid #e0e0e0;
            z-index: 1000; max-height: 80vh; overflow-y: auto;
        }
        .toc-title { font-size: 0.85em; font-weight: 600; color: #003366; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #e0e0e0; padding-bottom: 10px; }
        .toc-list { list-style: none; }
        .toc-list li { margin-bottom: 8px; }
        .toc-list a { display: block; font-size: 0.8em; color: #666; text-decoration: none; padding: 6px 10px; border-radius: 2px; transition: all 0.3s; }
        .toc-list a:hover { background: #f0f0f0; color: #003366; }
        .toc-list .toc-date { font-size: 0.7em; color: #999; display: block; margin-top: 2px; }
        .footer { text-align: center; padding: 40px 20px; color: #999; font-size: 0.85em; border-top: 1px solid #e0e0e0; margin-top: 60px; }
        @media (max-width: 600px) {
            header h1 { font-size: 1.4em; }
            .post-card { padding: 20px; }
            .post-meta { flex-direction: column; align-items: flex-start; gap: 10px; }
            .toc { display: none; }
            .container { padding-bottom: 20px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>{{TITLE}}</h1>
        <div class="subtitle">{{SUBTITLE}}</div>
        <div class="meta">{{META}}</div>
    </header>

    <div class="toc">
        <div class="toc-title">目录</div>
        <ul class="toc-list" id="toc-list"></ul>
    </div>

    <div class="container" id="container"></div>

    <div class="footer">
        <p>{{FOOTER_TEXT}}</p>
    </div>

    <script>
        const MOMENT_DATA = {{DATA_JSON}};

        function antiFoldProcess(text, intensity = 'medium') {
            if (!text || text.length === 0) return text;
            const config = { light: { min: 20, max: 30 }, medium: { min: 10, max: 15 }, heavy: { min: 5, max: 8 } };
            const chars = ['​', '', '', '﻿'];
            let result = text;
            for (let i = result.length; i > 0; i--) {
                if (Math.random() < (1 / (Math.floor(Math.random() * (config[intensity].max - config[intensity].min + 1)) + config[intensity].min))) {
                    result = result.slice(0, i) + chars[Math.floor(Math.random() * chars.length)] + result.slice(i);
                }
            }
            return result;
        }

        async function copyPost(btn) {
            const card = btn.closest('.post-card');
            const content = card.querySelector('.post-content');
            if (!content) return;
            const text = content.innerText;
            const processedText = antiFoldProcess(text, 'medium');
            try {
                await navigator.clipboard.writeText(processedText);
                btn.innerHTML = '✓ 已复制';
                btn.classList.add('copied');
                setTimeout(() => { btn.innerHTML = '📋 复制'; btn.classList.remove('copied'); }, 2000);
            } catch (e) {
                const textarea = document.createElement('textarea');
                textarea.value = processedText;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                btn.innerHTML = '✓ 已复制';
                setTimeout(() => { btn.innerHTML = ' 复制'; }, 2000);
            }
        }

        (function() {
            const today = new Date();
            const month = today.getMonth() + 1;
            const day = today.getDate();
            const dateStr = month + '/' + day;
            const dateToStage = { '9/5': 'stage-0', '9/6': 'stage-1', '9/7': 'stage-2', '9/8': 'stage-2', '9/9': 'stage-3', '9/10': 'stage-3' };
            const targetId = dateToStage[dateStr];
            if (targetId) {
                const targetEl = document.getElementById(targetId);
                if (targetEl) { setTimeout(() => { targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 500); }
            }
        })();

        function renderMoments() {
            const container = document.getElementById('container');
            const tocList = document.getElementById('toc-list');
            MOMENT_DATA.forEach((stage, stageIndex) => {
                const tocItem = document.createElement('li');
                tocItem.innerHTML = '<a href="#stage-' + stageIndex + '">' + stage.title + '<span class="toc-date">' + stage.date + '</span></a>';
                tocList.appendChild(tocItem);

                const stageSection = document.createElement('div');
                stageSection.className = 'stage-section';
                stageSection.id = 'stage-' + stageIndex;
                stageSection.innerHTML = '<div class="stage-header"><h2>' + stage.title + '</h2><div class="stage-desc">' + stage.date + ' · ' + stage.description + '</div></div>';

                stage.posts.forEach(post => {
                    const postCard = document.createElement('div');
                    postCard.className = 'post-card';
                    postCard.innerHTML = '<button class="copy-btn" onclick="copyPost(this)">📋 复制</button>' +
                        '<div class="post-meta"><span class="post-badge">' + post.badge + '</span><span class="post-date">' + post.date + '</span><span class="post-sequence">' + post.sequence + '</span></div>' +
                        (post.title ? '<div class="post-title">' + post.title + '</div>' : '') +
                        '<div class="post-content">' + post.content + '</div>' +
                        (post.imageSuggestion ? '<div class="image-suggestion"><strong>配图建议：</strong>' + post.imageSuggestion + '</div>' : '');
                    stageSection.appendChild(postCard);
                });

                container.appendChild(stageSection);
            });
        }

        renderMoments();
    </script>
</body>
</html>
